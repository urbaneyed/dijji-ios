# CI for the iOS SDK. Runs on every push + PR. Two jobs:
#
#   1. swift-build  — `swift build` on the GitHub macOS runner. Catches
#                     manifest errors and pure-Swift compile errors that
#                     don't depend on UIKit / UIApplication.
#   2. xcode-build  — full iOS-target build via xcodebuild against the
#                     simulator. Catches UIKit / UserNotifications path
#                     compile errors. Doesn't run tests yet — those need
#                     a host app for the simulator and we're SwiftPM only
#                     in v1.0-alpha (host app comes in v1.1).
#
# Free for public repos. Avg ~3 minutes per push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (macOS host target)
        run: swift build
      - name: Test
        run: swift test

  xcode-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun xcodebuild -showsdks | grep -E 'iphone|ios' || true
      # Use `generic/platform=iOS Simulator` rather than a named device —
      # the runner has the iOS Simulator SDK but not always the runtime
      # for a specific phone model. Generic builds the slice without
      # requiring a particular sim runtime to be downloaded first.
      - name: Build DijjiCore for iOS Simulator
        run: |
          xcodebuild build \
            -scheme DijjiCore \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build DijjiPush
        run: |
          xcodebuild build \
            -scheme DijjiPush \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build DijjiMessages
        run: |
          xcodebuild build \
            -scheme DijjiMessages \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
